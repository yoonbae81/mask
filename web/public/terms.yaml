# Mask 민감어 정의 (공개 예제)
#
# 규칙
#   - 분류명은 대문자 한 단어      ^[A-Z][A-Z0-9_]*$
#   - 주석 처리(#)한 줄은 마스킹하지 않습니다.
#
# 1회성 우회 (\용어)  — 서버에서 MASK_TERM_ESCAPE=true 일 때만 동작
#   등록된 용어를 딱 한 번만 마스킹 없이 보내고 싶으면 용어 앞에 백슬래시를 붙입니다.
#     예) "\프로젝트 네뷸라 사업을 검토했다"
#       → \프로젝트 네뷸라 만 원문 그대로 전송(\ 는 제거), 나머지 등록 용어는 정상 마스킹
#   - 뒤에 등록 용어가 오지 않는 \ 는 원문 그대로 유지됩니다 (코드·경로 무영향)
#   - 우회된 항목은 activity log 에 bypassed 카운트로 기록됩니다
#   - 보안 예외 기능이므로 기본은 off 입니다. 상시 on 을 권장하지 않습니다.

INTERNAL:
  - 알파테크
  - 알파
  - ALPHATECH

PROJECT:
  - Project 오로라
  # - 프로젝트 타이탄          ← 이번 세션에서는 노출
  - 프로젝트 네뷸라

CUSTOMER:
  - OMEGA
  - CORP

# ── 확장 형태 (terms / patterns 혼용 가능) ───────────────────
#
# PATH:
#   patterns:
#     - '(?i)[A-Z]:\\[^\s"''<>|]+'
#     - '/(?:home|Users)/[^\s"''<>|]+'
#
# DOCUMENT:
#   terms:
#     - Project 오로라 추진현황
#   patterns:
#     - 'DOC-\d{4}-\d{3}'
#
PII:                             # 개인식별정보 — 전화번호·주민번호·이메일·사번 등(patterns) + 임직원 이름(terms) 포괄
  patterns:                      # 체크섬 검증 없이 형식만 본다 (미탐 방지)
    - '\b01[016-9][-\s]?\d{3,4}[-\s]?\d{4}\b'  # 휴대전화
    - '\b0(?:2|[3-6][1-5])[-\s]?\d{3,4}[-\s]?\d{4}\b'  # 유선전화
    - '\b\d{6}[-\s]?[1-4]\d{6}\b'               # 주민등록번호
    - '\b\d{3}-\d{2}-\d{5}\b'                   # 사업자등록번호
    - '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'            # 이메일
    - '\b\d{6,10}\b'                            # 사번/직원번호 (6-10자리 숫자)
  # terms:                       # 임직원 이름도 같은 분류에 넣는다. 2글자 이름은 boundary: strict 검토
  #   - 홍길동
  #   - 김철수
#
# ── 특정 용어만 경계를 좁히고 싶을 때 ────────────────────────
# INTERNAL:
#   - 알파테크
#   - term: 알파
#     boundary: strict            # 왼쪽에 한글이 붙으면 매칭하지 않음
#                                 # (미탐 위험을 감수하는 선언. 사전 요약에 표시됨)
