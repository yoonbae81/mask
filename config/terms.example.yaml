# Mask 민감어 정의
#
# 실제 사용 파일의 경로는 환경변수 MASK_TERMS_FILE 로 지정한다.
# 이 파일을 복사해 원하는 위치에 두고 그 경로를 넣으면 된다.
#   예) MASK_TERMS_FILE=/opt/mask/config/terms.yaml
#       MASK_TERMS_FILE=/mnt/secure/terms/          (디렉터리면 *.yaml 전부 병합)
#
# 규칙
#   - 분류명은 대문자 한 단어      ^[A-Z][A-Z0-9_]*$
#   - 항목을 주석 처리하면 그 용어는 마스킹하지 않고 외부 LLM에 그대로 노출된다.
#     (조사 목적의 일시 노출용. 기동 배너에 "commented out" 개수로 표시된다)
#
# 1회성 우회 (\용어)  — 서버에서 MASK_TERM_ESCAPE=true 일 때만 동작
#   등록된 용어를 딱 한 번만 마스킹 없이 보내고 싶으면 용어 앞에 백슬래시를 붙인다.
#     예) "\프로젝트 네뷸라 사업을 검토했다. 알파테크도 참여했다."
#       → "\프로젝트 네뷸라" 만 원문 그대로 전송(\ 는 제거), "알파테크" 는 정상 마스킹
#   - 뒤에 등록 용어가 오지 않는 \ 는 원문 그대로 유지된다 (코드·경로 무영향)
#   - 리터럴 백슬래시 + 용어를 보내려면 \\용어 (첫 \ 만 소비됨)
#   - 우회된 항목은 activity log 에 bypassed 카운트로 기록된다
#   - 보안 예외 기능이므로 기본은 off (MASK_TERM_ESCAPE=off)

INTERNAL:
  - 알파테크
  - 알파
  - ALPHATECH

PROJECT:
  - Project 오로라
  # - 프로젝트 타이탄          ← 이번 세션에서는 노출
  - 프로젝트 네뷸라

CUSTOMER:
  - OMEGA
  - CORP

# ── 확장 형태 (terms / patterns 혼용 가능) ───────────────────
#
# PII:                            # 개인식별정보 — 임직원 이름(terms) + 형식 패턴(patterns) 혼용
#   terms:                        # deny-list 로 확정 처리한다. 2글자 이름은 boundary: strict 검토
#     - 홍길동
#     - 김철수
#   patterns:                     # 체크섬 검증 없이 형식만 본다 (미탐 방지)
#     - '\b01[016-9][-\s]?\d{3,4}[-\s]?\d{4}\b'  # 휴대전화
#     - '\b\d{6}[-\s]?[1-4]\d{6}\b'               # 주민등록번호
#     - '\b\d{3}-\d{2}-\d{5}\b'                   # 사업자등록번호
#     - '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'            # 이메일
#     - '\b\d{6,10}\b'                            # 사번/직원번호 (6-10자리 숫자)
#
# PATH:
#   patterns:
#     - '(?i)[A-Z]:\\[^\s"''<>|]+'
#     - '/(?:home|Users)/[^\s"''<>|]+'
#
# DOCUMENT:
#   terms:
#     - Project 오로라 추진현황
#   patterns:
#     - 'DOC-\d{4}-\d{3}'
#
# ── 특정 용어만 경계를 좁히고 싶을 때 ────────────────────────
# INTERNAL:
#   - 알파테크
#   - term: 알파
#     boundary: strict            # 왼쪽에 한글이 붙으면 매칭하지 않음
#                                 # (미탐 위험을 감수하는 선언. 배너에 표시됨)
